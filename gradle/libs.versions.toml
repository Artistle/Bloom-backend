[versions]
kotlin = "2.2.10"
springBoot = "4.1.1"
java = "21"

[libraries]
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springBoot" }

spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }

spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { group = "org.springframework.boot", name = "spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
spring-security-oauth2-jose = { group = "org.springframework.security", name = "spring-security-oauth2-jose" }
spring-security-messaging = { group = "org.springframework.security", name = "spring-security-messaging" }
spring-security-test = { group = "org.springframework.security", name = "spring-security-test" }

spring-boot-starter-websocket = { group = "org.springframework.boot", name = "spring-boot-starter-websocket" }
spring-messaging = { group = "org.springframework", name = "spring-messaging" }

spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
flyway-core = { group = "org.flywaydb", name = "flyway-core" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }
postgresql = { group = "org.postgresql", name = "postgresql" }

spring-boot-starter-cache = { group = "org.springframework.boot", name = "spring-boot-starter-cache" }
spring-boot-starter-data-redis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }

kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { group = "org.springframework.boot", name = "spring-boot-gradle-plugin", version.ref = "springBoot" }

jackson-module-kotlin = { group = "tools.jackson.module", name = "jackson-module-kotlin" }

kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[bundles]
security = [
    "spring-boot-starter-security",
    "spring-boot-starter-oauth2-resource-server",
    "spring-security-oauth2-jose",
]

websocket = [
    "spring-boot-starter-websocket",
    "spring-messaging",
    "spring-security-messaging",
]

persistence = [
    "spring-boot-starter-data-jpa",
    "spring-boot-starter-flyway",
    "flyway-postgresql",
]

cache = [
    "spring-boot-starter-cache",
    "spring-boot-starter-data-redis",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }

bloom-kotlin-library = { id = "bloom.kotlin.library" }
bloom-spring-library = { id = "bloom.spring.library" }
bloom-spring-web = { id = "bloom.spring.web" }
bloom-spring-persistence = { id = "bloom.spring.persistence" }
bloom-spring-security = { id = "bloom.spring.security" }
bloom-spring-websocket = { id = "bloom.spring.websocket" }
bloom-spring-application = { id = "bloom.spring.application" }
